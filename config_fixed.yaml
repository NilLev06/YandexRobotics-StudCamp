behaviors:
  GFSX_Brain_Fixed:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 192
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 192
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 15
    max_steps: 30000000
    time_horizon: 2048
    summary_freq: 20000
    checkpoint_interval: 1000000
