services:
  yolo-live:
    image: registry.robotics-lab.ru/robomarvel:v6
    container_name: z-boys-yolo-live
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    cpu_shares: 256
    working_dir: /tmp
    entrypoint:
      - /root/venv/bin/python
      - -u
      - /app/yolo_live_mjpeg.py
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /opt/ros/jazzy/lib/python3.12/site-packages:/root/vendor-python
      LD_LIBRARY_PATH: /opt/ros/jazzy/lib/aarch64-linux-gnu:/opt/ros/jazzy/lib:/usr/local/lib/aarch64-linux-gnu
      YOLO_CONFIG_DIR: /tmp
      OPENCV_FFMPEG_CAPTURE_OPTIONS: "rtsp_transport;tcp|timeout;5000000"
      RTSP_URL: rtsp://ros:8554/cam
      YOLO_MODEL: /root/rover_m2m_models/yolo11n-ball-cube-int8.onnx
      YOLO_IMAGE_SIZE: "512"
      YOLO_CONFIDENCE: "0.50"
      YOLO_INFERENCE_FPS: "2"
      MJPEG_STREAM_FPS: "10"
      MJPEG_QUALITY: "75"
      HTTP_HOST: 0.0.0.0
      # Same port inside the rover network: containers reach this sidecar as
      # z-boys-yolo-live:8092 (object_search.py / dashboard / telemetry). Do
      # not change this alone — browser links on host port 8092 expect it too.
      HTTP_PORT: "8092"
      MAX_STREAM_CLIENTS: "4"
      ROS_DISTRO: jazzy
      ROS_DOMAIN_ID: "0"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_LOG_DIR: /tmp
      ROS_IMAGE_TOPIC: /camera/yolo/image_annotated/compressed
      ROS_IMAGE_FRAME_ID: camera_frame
      ROS_IMAGE_FPS: "5"
    volumes:
      - ./scripts/yolo_live_mjpeg.py:/app/yolo_live_mjpeg.py:ro
      - /home/robomarvel/robomarvel/rover_m2m/models:/root/rover_m2m_models:ro
      - ./vendor-python:/root/vendor-python:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    ports:
      # Bind on all interfaces instead of a hardcoded LAN IP so this survives
      # a DHCP lease change; still LAN-only in practice since the rover has
      # no public interface. See YOLO_LIVE.md for the unauthenticated-stream
      # caveat.
      - "${YOLO_LIVE_BIND_HOST:-0.0.0.0}:8092:8092"
    networks:
      - rover-main
    healthcheck:
      test:
        - CMD
        - /root/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=3).read()"
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 30s
    stop_grace_period: 8s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  rover-main:
    external: true
    name: robomarvel_default
