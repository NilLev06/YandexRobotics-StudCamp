launch:
  - node:
      pkg: hwnode
      exec: hwnode
  - include:
      # voice.launch.py starts BOTH stt_node and tts_node. STT fills
      # /voice/recognized_text for object_search_manager ("ровер, найди мяч").
      file: $(find-pkg-share voice)/launch/voice.launch.py
  - node:
      pkg: main
      exec: battery_guard.py
      name: battery_guard
      output: screen
  - node:
      pkg: main
      exec: object_search_manager.py
      name: object_search_manager
      output: screen
  - include:
      file: $(find-pkg-share main)/launch/bridge.yaml
  - include:
      file: $(find-pkg-share main)/launch/urdf.yaml
  - include:
      file: $(find-pkg-share main)/launch/lidar.yaml
  - include:
      file: $(find-pkg-share main)/launch/icp.yaml
  - node:
      pkg: main
      exec: odom_sanitizer.py
      name: odom_sanitizer
      output: screen
  - include:
      file: $(find-pkg-share main)/launch/nav2.yaml
  - include:
      file: $(find-pkg-share main)/launch/goal_proxy.yaml
  - include:
      file: $(find-pkg-share main)/launch/adaptive_mapping.launch.py
  - node:
      pkg: main
      exec: maze_explorer.py
      name: maze_explorer
      output: screen
      param:
      - { name: scan_timeout_sec, value: 16.0 }
  - include:
      file: $(find-pkg-share main)/launch/camera_stream.yaml
