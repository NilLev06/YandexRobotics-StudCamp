<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RoboMarvel — центр управления</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #0b0f14; color: #e8edf3; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid #1c2530; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header a { color: #7cc7ff; text-decoration: none; font-size: 13px; margin-left: 14px; }
  header a:hover { text-decoration: underline; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #1c2530; height: calc(100vh - 49px); }
  .panel { background: #0b0f14; display: flex; flex-direction: column; min-width: 0; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #8793a1; margin: 0; padding: 8px 12px; }
  .panel-body { flex: 1; min-height: 0; }
  #cam { width: 100%; height: 100%; object-fit: contain; background: #05070a; display: block; }
  #dash { width: 100%; height: 100%; border: 0; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; height: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>RoboMarvel &middot; центр управления</h1>
  <a id="link-map" href="#" target="_blank">Карта</a>
  <a id="link-snapshot" href="#" target="_blank">снимок</a>
  <a id="link-foxglove" href="#" target="_blank">Foxglove</a>
  <a id="link-health" href="#" target="_blank">YOLO health</a>
</header>
<main>
  <section class="panel">
    <h2>Камера + YOLO</h2>
    <div class="panel-body"><img id="cam" alt="камера ровера"></div>
  </section>
  <section class="panel">
    <h2>Телеметрия</h2>
    <div class="panel-body"><iframe id="dash" title="дашборд"></iframe></div>
  </section>
</main>
<script>
  const host = location.hostname;
  document.getElementById('cam').src = `http://${host}:8091/stream.mjpg`;
  document.getElementById('dash').src = `http://${host}:8092/`;
  document.getElementById('link-map').href = `http://${host}:8093/`;
  document.getElementById('link-snapshot').href = `http://${host}:8091/snapshot.jpg`;
  document.getElementById('link-health').href = `http://${host}:8091/health`;
  // Foxglove Studio, connected to the rover's foxglove_bridge websocket
  document.getElementById('link-foxglove').href =
    `https://app.foxglove.dev/?ds=foxglove-websocket&ds.url=ws%3A%2F%2F${host}%3A8765`;
</script>
</body>
</html>
