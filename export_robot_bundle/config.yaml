behaviors:
  GFSX_Brain_Fixed:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 0.0003
      beta: 0.008
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      # Keep LR/beta alive — linear→0 caused late collapse / reward hacking.
      learning_rate_schedule: constant
      beta_schedule: constant
    network_settings:
      normalize: true
      # Slightly smaller net: less overfit on dense shaping noise.
      hidden_units: 192
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 192
    reward_signals:
      extrinsic:
        # Longer credit assignment for search → approach → grasp.
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    max_steps: 30000000
    # Match longer Unity episodes (~4000 steps) without truncating mid-search.
    time_horizon: 2048
    summary_freq: 20000
    checkpoint_interval: 500000

  GFSX_Brain_Mobile:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 0.0003
      beta: 0.008
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 192
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 192
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    max_steps: 30000000
    time_horizon: 2048
    summary_freq: 20000
    checkpoint_interval: 500000
