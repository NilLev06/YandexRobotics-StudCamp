# Телеметрийные сайдкары: rosbag2-рекордер всех топиков + видеорекордер.
# Управляются scripts/run_telemetry.sh, который задаёт TELEMETRY_SESSION_DIR —
# абсолютный путь к каталогу текущей сессии на хосте.

services:
  bag:
    image: registry.robotics-lab.ru/robomarvel:v6
    container_name: z-boys-bag
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    cpu_shares: 256
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_DOMAIN_ID: "0"
      ROS_LOG_DIR: /tmp
      HOME: /tmp
    entrypoint:
      - /bin/bash
      - -lc
      - >
        source /opt/ros/jazzy/setup.bash &&
        exec ros2 bag record
        --include-hidden-topics
        --max-bag-size 536870912
        -o /logs/session/bag
        -e '/scan|/tf|/tf_static|/cmd_vel|/hardware/.*|/icp/.*|/ekf/.*|/odometry.*|/map($|/.*)|/plan.*|/goal($|/.*)|/camera/yolo/.*|/voice/.*|/diagnostics.*|/behavior_tree_log|/spin/_action/status|/navigate_to_pose/_action/status'
    volumes:
      - ${TELEMETRY_SESSION_DIR:?set by run_telemetry.sh}:/logs/session
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - rover-main
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  video:
    image: registry.robotics-lab.ru/robomarvel:v6
    container_name: z-boys-video
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    cpu_shares: 128
    entrypoint:
      - /bin/mediamtx
      - /telemetry-mediamtx.yml
    volumes:
      - ${TELEMETRY_SESSION_DIR:?set by run_telemetry.sh}:/logs/session
      - ./config/telemetry-mediamtx.yml:/telemetry-mediamtx.yml:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - rover-main
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  rover-main:
    external: true
    name: robomarvel_default
